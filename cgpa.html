<!DOCTYPE html>
<html>
<head>
    <title>CGPA to Percentage Converter (CBSE)</title>
    <meta name="description" content="Convert CBSE CGPA to percentage and percentage to CGPA instantly.">
</head>
<body style="background-color:black; color:aqua; font-family:Arial; max-width:800px; margin:auto;">

<h1>CGPA ↔ Percentage Converter</h1>

<h3>CGPA to Percentage</h3>

<label>Enter CGPA:</label><br>
<input type="number" step="0.1" id="cgpa"><br><br>
<button onclick="cgpaToPercentage()">Convert</button>

<h3>Percentage to CGPA</h3>

<label>Enter Percentage:</label><br>
<input type="number" id="percentage"><br><br>
<button style="background-color: darkslategrey; onclick="percentageToCgpa()">Convert</button>

<h2 id="result"></h2>

<script>
function cgpaToPercentage() {
    let cgpa = Number(document.getElementById("cgpa").value);
    let percentage = cgpa * 9.5;

    document.getElementById("result").innerText =
        "Percentage: " + percentage.toFixed(2) + "%";
}

function percentageToCgpa() {
    let percentage = Number(document.getElementById("percentage").value);
    let cgpa = percentage / 9.5;

    document.getElementById("result").innerText =
        "CGPA: " + cgpa.toFixed(2);
}
</script>

</body>
</html>
